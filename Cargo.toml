[workspace]
members = [
  "kernel",
  "libs/greenlime-abi",
  "libs/greenlime-font",
  "userland/init",
  "userland/shell",
  "userland/demo",
  "userland/fuzz",
  "userland/wallpaper",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[workspace.dependencies]
greenlime-abi = { path = "libs/greenlime-abi" }
greenlime-font = { path = "libs/greenlime-font" }
limine = "0.5"
spin = "0.10"
uart_16550 = "0.8"
x86_64 = "0.15"
bitflags = "2"
linked_list_allocator = "0.10"
pic8259 = "0.11"
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
# Pure-Rust JPEG decode (userland wallpaper task): both the SIMD ("x86")
# and std features off — the scheduler swaps no FP state.
zune-jpeg = { version = "0.5", default-features = false }
zune-core = { version = "0.5", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = [
  "alloc",
  "medium-ethernet",
  "proto-ipv4",
  "proto-dhcpv4",
  "socket-dhcpv4",
  "socket-icmp",
  "socket-udp",
  "socket-tcp",
] }
