[package]
name = "greenlime-shell"
version.workspace = true
edition.workspace = true
description = "GreenLime shell — scripted builtin demo over IPC (static, no_std)"

[[bin]]
name = "greenlime-shell"
path = "src/main.rs"

[dependencies]
greenlime-abi = { workspace = true }
# M20: TLS 1.3 fetch lane (crypto + rustls + webpki-roots; the shell owns
# only the TCP transport glue) + a heap for it (chain parsing allocates).
greenlime-tls = { workspace = true }
linked_list_allocator = { workspace = true }
